# bored? on the Raspberry Pi. Managed by setup.sh and update.sh; your settings live in .env
services:
  bored:
    image: ${BORED_IMAGE}
    container_name: bored
    restart: unless-stopped
    ports:
      # BORED_BIND=127.0.0.1 means only the Pi itself (your Cloudflare tunnel) can reach the app
      - "${BORED_BIND:-0.0.0.0}:${BORED_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Europe/Brussels}
      - DEFAULT_HOURS_PER_UNLOCK=${DEFAULT_HOURS_PER_UNLOCK:-20}
      - MAX_SIGNUPS_PER_DAY=${MAX_SIGNUPS_PER_DAY:-100}
      - PRIVACY_CONTACT=${PRIVACY_CONTACT:-}
    # Hardening: nothing in the container can be modified except /data,
    # no Linux capabilities, no privilege escalation, capped memory and processes.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
