# Every push to main: test the app, then build a Docker image for the Pi (and x86)
# and publish it to GitHub Container Registry. The Pi picks it up within 5 minutes.
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.js && node --check public/app.js
      - name: Smoke test
        run: |
          DATA_DIR=$(mktemp -d) PORT=3999 node --experimental-sqlite --disable-warning=ExperimentalWarning server.js &
          for i in $(seq 1 20); do curl -fs localhost:3999/healthz && break; sleep 0.5; done
          curl -fs localhost:3999/api/config
          curl -fs -o /dev/null localhost:3999/
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"password123"}' localhost:3999/api/register
          curl -fs -b jar -H 'Content-Type: application/json' -d '{"name":"Test"}' localhost:3999/api/items > /dev/null
          curl -fs -b jar localhost:3999/api/state > /dev/null
          echo "Smoke test passed"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.short }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
